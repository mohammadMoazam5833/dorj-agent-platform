<!doctype html>
<!-- Dorj Agent desktop sign-in overlay. IPC contract unchanged:
     ipcRenderer.send("thin-login-prompt", {action: "save"|"quit", ...}); the main process writes
     status/errors into #error and toggles #save. Farsi first, English switch. -->
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' file: data:; font-src 'self'">
<link rel="icon" href="brand/dorj-agent-favicon.png" type="image/png">
<title>Dorj Agent</title>
<style>
  @font-face { font-family: 'Vazirmatn'; src: url(vazirmatn-400.woff2) format('woff2'); font-weight: 400; font-display: block; }
  @font-face { font-family: 'Vazirmatn'; src: url(vazirmatn-600.woff2) format('woff2'); font-weight: 600 800; font-display: block; }
  :root {
    --navy: #0B1B3A; --lapis: #1E3A8A; --lapis-700: #16295e; --gold: #E8A317; --gold-soft: #F4C24B;
    --surface: #f5f7fb; --text: #0c1a33; --muted: #56657f; --line: #dde5f0; --input: #16213a; --err: #b3261e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'Vazirmatn', 'Segoe UI', Tahoma, system-ui, sans-serif; color: var(--text); background: var(--surface);
         display: grid; grid-template-columns: 1fr 400px; overflow: hidden; user-select: none; }

  .brand { position: relative; overflow: hidden; color: #e8eefb;
           background: radial-gradient(120% 90% at 85% 10%, #2a4585 0%, #1b3266 45%, #0b1838 100%); }
  .brand::after { content: ""; position: absolute; inset-block: 0; inset-inline-end: 0; width: 1px;
                  background: linear-gradient(180deg, transparent, rgba(180,198,236,.25), transparent); }
  .brand-inner { position: relative; z-index: 1; height: 100%; max-width: 520px; margin-inline-end: auto;
                 padding: 76px 56px 52px; display: flex; flex-direction: column; }
  .wordmark { width: 120px; height: 40px; display: block; }
  .d3 { position: relative; width: 122px; height: 132px; margin: 42px 0 30px; perspective: 700px; }
  .d3 img { display: block; width: 122px; height: auto; transform-origin: 50% 60%;
            filter: drop-shadow(1px 1px 0 #d4defa) drop-shadow(1px 1px 0 #b3c4f2) drop-shadow(1px 1px 0 #93aaea)
                    drop-shadow(1px 1px 0 #7590df) drop-shadow(1px 1px 0 #5876d1) drop-shadow(1px 1px 0 #3d5dc0)
                    drop-shadow(0 18px 28px rgba(12,30,90,.6)) drop-shadow(0 0 26px rgba(110,150,255,.35));
            animation: dFloat 5.5s ease-in-out infinite; }
  .d3::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 96px; height: 14px; margin-left: -48px;
               border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.5), transparent);
               animation: dShadow 5.5s ease-in-out infinite; }
  @keyframes dFloat { 0%,100% { transform: translateY(0) rotateY(-16deg) rotateX(6deg); } 50% { transform: translateY(-16px) rotateY(12deg) rotateX(-4deg); } }
  @keyframes dShadow { 0%,100% { transform: scale(1); opacity: .75; } 50% { transform: scale(.72); opacity: .4; } }
  .lead { margin: 0; font-size: 29px; font-weight: 800; line-height: 1.65; color: #f3f6fc; max-width: 24ch; }
  .lead::after { content: ""; display: block; width: 54px; height: 3px; border-radius: 3px; margin-top: 18px;
                 background: linear-gradient(90deg, var(--gold-soft), rgba(232,163,23,0)); }
  ul { list-style: none; display: flex; flex-direction: column; gap: 20px; padding: 0; margin: auto 0 0; }
  li { display: flex; align-items: flex-start; gap: 14px; }
  .ic { flex-shrink: 0; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px;
        color: var(--gold-soft); background: rgba(232,163,23,.10); border: 1px solid rgba(232,163,23,.24); }
  .feature b { display: block; font-size: 15.5px; color: #f3f6fc; }
  .feature span { font-size: 13px; color: rgba(210,220,240,.62); line-height: 1.6; }

  .form { position: relative; display: flex; align-items: center; justify-content: center; padding: 104px 32px 36px; overflow-y: auto; }
  .topbar { position: absolute; top: 24px; inset-inline: 32px; display: flex; justify-content: flex-end; }
  .card { width: 100%; max-width: 400px; animation: fadeUp .6s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  .lang { font: 600 13px/1 'Vazirmatn', sans-serif; color: var(--navy);
          background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; cursor: pointer;
          box-shadow: 0 1px 2px rgba(12,26,51,.06); transition: border-color .15s; }
  .lang:hover { border-color: var(--lapis); }
  h1 { margin: 0 0 6px; font-size: 26px; line-height: 1.35; color: var(--navy); }
  .sub { margin: 0 0 30px; font-size: 14px; color: var(--muted); line-height: 1.6; }
  label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: var(--navy); }
  .field { position: relative; margin-bottom: 18px; }
  input { width: 100%; height: 50px; background: #fbfcfe; border: 1.5px solid var(--line); border-radius: 11px;
          color: var(--input); font: 15px 'Vazirmatn', sans-serif; padding: 0 14px; direction: ltr; text-align: left; outline: none;
          transition: border-color .15s, box-shadow .15s, background .15s; }
  input:focus { border-color: var(--lapis); background: #fff; box-shadow: rgba(30,58,138,.16) 0 0 0 4px; }
  .eye { position: absolute; right: 9px; top: 9px; width: 32px; height: 32px; border: 0; border-radius: 9px; background: none;
         color: #8a97b0; display: grid; place-items: center; cursor: pointer; }
  .eye:hover { color: var(--lapis); }
  .actions { margin-top: 8px; }
  button.primary { width: 100%; height: 52px; border: 0; border-radius: 12px; color: #fff; font: 700 15.5px 'Vazirmatn', sans-serif;
                   background: linear-gradient(120deg, var(--lapis) 0%, var(--lapis-700) 100%); cursor: pointer;
                   box-shadow: rgba(30,58,138,.4) 0 12px 26px -12px; transition: box-shadow .2s, transform .1s; }
  button.primary:hover { box-shadow: rgba(30,58,138,.5) 0 16px 34px -12px; }
  button.primary:active { transform: translateY(1px); }
  button.primary:disabled { opacity: .7; cursor: progress; }
  button.ghost { width: 100%; margin-top: 10px; height: 44px; border: 0; border-radius: 12px; background: none; color: var(--muted);
                 font: 600 13.5px 'Vazirmatn', sans-serif; cursor: pointer; }
  button.ghost:hover { color: var(--lapis); }
  #error { display: none; }
  .msg { min-height: 22px; margin-top: 14px; font-size: 13px; color: var(--err); line-height: 1.7; }
  .msg.info { color: var(--muted); }
  .note { display: flex; align-items: flex-start; gap: 8px; margin-top: 24px; font-size: 12px; color: var(--muted); line-height: 1.8; }
  .note svg { flex-shrink: 0; color: var(--lapis); margin-top: 2px; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff;
             border-radius: 50%; vertical-align: -2px; margin-inline-end: 8px; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; }
    .brand { display: none; }
    .form { padding-top: 76px; }
  }
  @media (prefers-reduced-motion: reduce) { .d3 img, .d3::after, .card, .spinner { animation: none; } }

  /* Dorj Graphite (2026-10-08): dark neutral sign-in like Cursor/Claude; gold only on the primary button */
  body { background: #16171A; color: #E4E6EA; }
  .brand { color: #E4E6EA; background: radial-gradient(120% 90% at 85% 10%, #2B2E34 0%, #1C1E22 45%, #0F1012 100%); }
  .lead, .feature b { color: #F2F3F5; }
  .feature span { color: rgba(228,230,234,.55); }
  h1, label { color: #F2F3F5; }
  .sub { color: #8A909B; }
  .lang { color: #E4E6EA; background: #1D1F23; border-color: #2C2F35; }
  .lang:hover { border-color: #7AA7FF; }
  input { background: #1D1F23; border-color: #2C2F35; color: #E4E6EA; }
  input:focus { border-color: #7AA7FF; background: #1D1F23; box-shadow: rgba(122,167,255,.18) 0 0 0 4px; }
  .eye { color: #6B717C; } .eye:hover { color: #E4E6EA; }
  button.primary { color: #0F1012; background: linear-gradient(120deg, #F4C24B 0%, #E8A317 100%); box-shadow: rgba(232,163,23,.28) 0 12px 26px -12px; }
  button.primary:hover { box-shadow: rgba(232,163,23,.4) 0 16px 34px -12px; }
</style>
</head>
<body>
  <section class="brand" aria-hidden="true">
    <div class="brand-inner">
      <img class="wordmark" src="brand/dorj-wordmark.png" alt="">
      <div class="d3"><img src="brand/dorj-d.png" alt=""></div>
      <h2 class="lead" data-t="lead"></h2>
      <ul>
        <li><span class="ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><rect x="7" y="10" width="6" height="4" rx="1"/><path d="M17 10v4M6 6V4M10 6V4M14 6V4M6 20v-2M10 20v-2M14 20v-2"/></svg></span><div class="feature"><b data-t="f1"></b><span data-t="f1s"></span></div></li>
        <li><span class="ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8l9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/></svg></span><div class="feature"><b data-t="f2"></b><span data-t="f2s"></span></div></li>
        <li><span class="ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 16v-4M12 16V8M16 16v-6"/></svg></span><div class="feature"><b data-t="f3"></b><span data-t="f3s"></span></div></li>
      </ul>
    </div>
  </section>

  <main class="form">
    <div class="topbar"><button type="button" class="lang" id="lang"></button></div>
    <div class="card">
      <h1 data-t="title"></h1>
      <p class="sub" data-t="sub"></p>
      <label for="username" data-t="user"></label>
      <div class="field"><input id="username" type="text" autocomplete="username" spellcheck="false" autofocus></div>
      <label for="password" data-t="pass"></label>
      <div class="field">
        <input id="password" type="password" autocomplete="current-password">
        <button type="button" class="eye" id="eye" tabindex="-1" aria-label="show password"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 5c-5 0-9.27 3.11-11 7 1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg></button>
      </div>
      <div class="actions"><button type="button" class="primary" id="save"></button></div>
      <button type="button" class="ghost" id="quit"></button>
      <!-- main.mjs reports through #error (English text); the observer shows it translated in #msg -->
      <div id="error" hidden></div>
      <div class="msg" id="msg" aria-live="polite"></div>
      <div class="note"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3zm4.7 7.3-5.6 5.6-2.8-2.8 1.1-1.1 1.7 1.7 4.5-4.5 1.1 1.1z"/></svg><span data-t="note"></span></div>
    </div>
  </main>
<script>
  const { ipcRenderer } = require("electron");
  const T = {
    fa: { lead: "دستیار دُرج در کنار تیم فنی شما",
          f1: "روی پروژه‌های خودتان", f1s: "فقط روی فایل‌های همین رایانه کار می‌کند",
          f2: "ترمینال و تست واقعی", f2s: "build و تست را اجرا می‌کند و نتیجه را اصلاح می‌کند",
          f3: "زیرساخت امن سازمان", f3s: "بدون کلید اضافه و آماده برای استفاده",
          title: "ورود به دستیار دُرج", sub: "با نام کاربری و گذرواژه‌ی سازمانی خود وارد شوید.",
          user: "نام کاربری یا ایمیل", pass: "گذرواژه", save: "ورود", quit: "بستن", lang: "English",
          note: "اتصال رمزنگاری‌شده است و فقط فایل‌هایی که اجازه دهید در اختیار دستیار قرار می‌گیرد.",
          empty: "نام کاربری و گذرواژه را وارد کنید.", busy: "در حال ورود…",
          "invalid username or password": "نام کاربری یا گذرواژه نادرست است.",
          "sign-in service unavailable": "سرویس ورود در دسترس نیست؛ کمی بعد دوباره تلاش کنید.",
          "this account is disabled; contact your administrator": "این حساب غیرفعال شده است؛ با مدیر سیستم تماس بگیرید.",
          network: "اتصال به سرور برقرار نشد. شبکه یا VPN را بررسی کنید." },
    en: { lead: "Dorj Agent works beside your engineering team",
          f1: "On your own projects", f1s: "Works only on files on this computer",
          f2: "Real terminal and tests", f2s: "Runs builds and tests, then fixes failures",
          f3: "Secure organisation platform", f3s: "Ready to use with no extra keys",
          title: "Sign in to Dorj Agent", sub: "Use your organisation username and password.",
          user: "Username or email", pass: "Password", save: "Sign in", quit: "Close", lang: "فارسی",
          note: "The connection is encrypted; the assistant sees only the files you allow.",
          empty: "Enter your username and password.", busy: "Signing in…",
          network: "Could not reach the server. Check your network or VPN." },
  };
  let lang = localStorage.getItem("nova-lang") || "fa";
  const $ = (id) => document.getElementById(id);
  const msg = $("msg"), save = $("save");
  function apply() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";
    document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = T[lang][el.dataset.t]; });
    save.textContent = T[lang].save; $("quit").textContent = T[lang].quit; $("lang").textContent = T[lang].lang;
  }
  function show(text, info) { msg.className = "msg" + (info ? " info" : ""); msg.textContent = text; }
  new MutationObserver(() => {
    const raw = $("error").textContent.trim();
    if (!raw) return show("");
    if (/^signing in/i.test(raw)) { save.innerHTML = '<span class="spinner"></span>' + T[lang].busy; return show(""); }
    save.textContent = T[lang].save;
    const known = T[lang][raw] || T.fa[raw] && T[lang][raw];
    show(known || (/fetch|network|ECONN|ENOTFOUND|ERR_/i.test(raw) ? T[lang].network : raw));
  }).observe($("error"), { childList: true, characterData: true, subtree: true });
  new MutationObserver(() => { if (!save.disabled && save.querySelector(".spinner")) save.textContent = T[lang].save; })
    .observe(save, { attributes: true, attributeFilter: ["disabled"] });
  $("lang").onclick = () => { lang = lang === "fa" ? "en" : "fa"; try { localStorage.setItem("nova-lang", lang); } catch {} apply(); };
  $("eye").onclick = () => { const p = $("password"); p.type = p.type === "password" ? "text" : "password"; };
  $("quit").onclick = () => ipcRenderer.send("thin-login-prompt", { action: "quit" });
  save.onclick = () => {
    const u = $("username").value.trim(), p = $("password").value;
    if (!u || !p) return show(T[lang].empty);
    show("");
    ipcRenderer.send("thin-login-prompt", { action: "save", username: u, password: p });
  };
  for (const id of ["username", "password"]) $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") save.click(); });
  apply();
</script>
</body>
</html>
