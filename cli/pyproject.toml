[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-cli"
version = "0.2.0"
description = "NovaAgent command line: run coding agents in your NovaAgent workspace"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27", "websockets>=12"]

[project.scripts]
nova = "nova_cli.main:main"
