[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dorj-agent-cli"
version = "0.4.1"
description = "Dorj Agent command line: run coding agents in your current directory"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27", "websockets>=12"]

[project.scripts]
nova = "dorj_agent_cli.main:main"
dorj-agent = "dorj_agent_cli.main:main"
