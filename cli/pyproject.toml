[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-cli"
version = "0.3.0"
description = "Dorj Agent command line: run coding agents in your Dorj Agent workspace"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27", "websockets>=12"]

[project.scripts]
nova = "nova_cli.main:main"
dorj-agent = "nova_cli.main:main"
