# unprivileged nginx serving the download page under /download/
pid /tmp/nginx.pid;
events {}
http {
  include /etc/nginx/mime.types;
  types { application/vnd.debian.binary-package deb; application/octet-stream AppImage exe whl; application/x-x509-ca-cert crt; }
  client_body_temp_path /tmp/cb; proxy_temp_path /tmp/p; fastcgi_temp_path /tmp/f; uwsgi_temp_path /tmp/u; scgi_temp_path /tmp/s;
  access_log /dev/stdout; error_log /dev/stderr warn;
  server_tokens off;
  server {
    listen 8080;
    location = /healthz { return 200 "ok\n"; }
    location = /download { return 301 /download/; }
    location /download/ {
      alias /srv/download/;
      add_header X-Content-Type-Options nosniff;
      location ~ \.(exe|deb|AppImage|whl)$ { add_header Content-Disposition attachment; add_header X-Content-Type-Options nosniff; }
    }
  }
}
